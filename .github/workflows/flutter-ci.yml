name: flight_vis CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Determine signing policy
        id: signing_policy
        run: |
          require=false
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ] || echo "${{ github.ref }}" | grep -q '^refs/tags/v'; then
              require=true
            fi
          fi
          echo "require_release_keystore=$require" >> "$GITHUB_OUTPUT"

      - name: flutter pub get
        run: flutter pub get

      - name: Verify ARB key parity
        run: dart run tool/verify_arb_keys.dart

      - name: Check hardcoded UI strings
        run: dart run tool/check_hardcoded_ui_strings.dart

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Validate release signing secrets
        if: steps.signing_policy.outputs.require_release_keystore == 'true'
        env:
          FLIGHTVIS_KEYSTORE_BASE64: ${{ secrets.FLIGHTVIS_KEYSTORE_BASE64 }}
          FLIGHTVIS_KEYSTORE_PASSWORD: ${{ secrets.FLIGHTVIS_KEYSTORE_PASSWORD }}
          FLIGHTVIS_KEY_ALIAS: ${{ secrets.FLIGHTVIS_KEY_ALIAS }}
          FLIGHTVIS_KEY_PASSWORD: ${{ secrets.FLIGHTVIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in FLIGHTVIS_KEYSTORE_BASE64 FLIGHTVIS_KEYSTORE_PASSWORD FLIGHTVIS_KEY_ALIAS FLIGHTVIS_KEY_PASSWORD; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::error::Missing GitHub secret $name (required on main and version tags)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Decode release keystore
        id: keystore
        env:
          FLIGHTVIS_KEYSTORE_BASE64: ${{ secrets.FLIGHTVIS_KEYSTORE_BASE64 }}
          FLIGHTVIS_KEYSTORE_PASSWORD: ${{ secrets.FLIGHTVIS_KEYSTORE_PASSWORD }}
          FLIGHTVIS_KEY_ALIAS: ${{ secrets.FLIGHTVIS_KEY_ALIAS }}
          FLIGHTVIS_KEY_PASSWORD: ${{ secrets.FLIGHTVIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$FLIGHTVIS_KEYSTORE_BASE64" ]; then
            echo "$FLIGHTVIS_KEYSTORE_BASE64" | base64 -d > android/release.keystore
            cat > android/key.properties <<EOF
          storePassword=$FLIGHTVIS_KEYSTORE_PASSWORD
          keyPassword=$FLIGHTVIS_KEY_PASSWORD
          keyAlias=$FLIGHTVIS_KEY_ALIAS
          storeFile=release.keystore
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.signing_policy.outputs.require_release_keystore }}" = "true" ]; then
              echo "::error::Release keystore decode failed on protected ref"
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Android debug keystore (PR debug-signed APK)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FLIGHTVIS_BASE_URL=https://flight.heavenly.cl

      - name: Package metadata
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "$SHA" > build/app-release.apk.sha256
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=${VERSION%%+*}
          VERSION_CODE=${VERSION##*+}
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            RELEASE_SIGNED=true
          else
            RELEASE_SIGNED=false
          fi
          cat > build/app-release.json <<EOF
          {"version":"$VERSION_NAME","versionCode":$VERSION_CODE,"sha256":"$SHA","commit":"${{ github.sha }}","releaseSigned":$RELEASE_SIGNED}
          EOF

      - name: Extract APK signing certificate SHA-256
        id: cert
        env:
          FLIGHTVIS_KEY_ALIAS: ${{ secrets.FLIGHTVIS_KEY_ALIAS }}
          FLIGHTVIS_KEYSTORE_PASSWORD: ${{ secrets.FLIGHTVIS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            APKSIGNER="$(find "${ANDROID_HOME:-$HOME/Android/Sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
            OUT=""
            if [ -n "$APKSIGNER" ]; then
              set +e
              OUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
              set -e
            fi
            echo "$OUT" | tee build/app-release.cert-sha256.txt
            FINGERPRINT="$(echo "$OUT" | grep -m1 'SHA-256' | awk '{print $2}' || true)"
            if [ -z "$FINGERPRINT" ]; then
              keytool -list -v \
                -keystore android/release.keystore \
                -alias "$FLIGHTVIS_KEY_ALIAS" \
                -storepass "$FLIGHTVIS_KEYSTORE_PASSWORD" 2>&1 | tee build/app-release.cert-sha256.txt
              FINGERPRINT="$(grep -m1 -E 'SHA-?256:' build/app-release.cert-sha256.txt | sed -E 's/.*SHA-?256: *//' || true)"
            fi
          else
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android -keypass android 2>&1 | tee build/app-release.cert-sha256.txt
            FINGERPRINT="$(grep -m1 -E 'SHA-?256:' build/app-release.cert-sha256.txt | sed -E 's/.*SHA-?256: *//' || true)"
          fi
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::Could not parse signing certificate SHA-256"
            exit 1
          fi
          echo "$FINGERPRINT" > build/app-release.cert-sha256
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Verify release artifact bundle
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -f build/app-release.apk.sha256
          test -f build/app-release.json
          test -s build/app-release.cert-sha256
          echo "release bundle OK"

      - name: Job summary
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            echo "### APK signed with release keystore" >> "$GITHUB_STEP_SUMMARY"
            echo "Signing cert SHA-256: \`${{ steps.cert.outputs.fingerprint }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK debug-signed (PR only — not for App Links / publish)" >> "$GITHUB_STEP_SUMMARY"
            echo "Signing cert SHA-256: \`${{ steps.cert.outputs.fingerprint }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Artifacts: app-release.apk, app-release.apk.sha256, app-release.json, app-release.cert-sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Golden UI screenshots (widget tests)
        run: flutter test test/golden_screenshots_test.dart

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.keystore.outputs.signed == 'true' && format('flight-vis-android-{0}', github.sha) || format('flight-vis-android-debugsigned-{0}', github.sha) }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.apk.sha256
            build/app-release.json
            build/app-release.cert-sha256
            docs/screenshots/

      - name: Attach to GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.apk.sha256
            build/app-release.json
            build/app-release.cert-sha256

  emulator-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, android-emulator]
    permissions:
      contents: read
    timeout-minutes: 35
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve emulator CPU arch
        id: emu_arch
        run: |
          ARCH="${{ vars.EMULATOR_ARCH }}"
          if [ -z "$ARCH" ]; then ARCH=x86_64; fi
          case "$ARCH" in
            x86_64|arm64-v8a) ;;
            *) echo "::error::EMULATOR_ARCH must be x86_64 or arm64-v8a (got $ARCH)"; exit 1 ;;
          esac
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "flightvis-ci: EMULATOR_ARCH=$ARCH"

      - name: flutter pub get
        run: flutter pub get

      - name: Start mock flight_vis API
        run: |
          dart run tool/mock_flight_vis_server.dart &
          echo $! > mock_server.pid
          for i in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:18080/api/devices/anonymous \
              -H 'Content-Type: application/json' \
              -d '{"name":"CI"}'; then
              echo "mock API ready"
              exit 0
            fi
            sleep 2
          done
          echo "mock API failed to start"
          exit 1

      - name: Verify mock API on host
        run: curl -sf http://127.0.0.1:18080/api/ci-health

      - name: Prebuild debug APK (functional)
        run: flutter build apk --debug --dart-define-from-file=tool/ci_functional_defines.json

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: ${{ steps.emu_arch.outputs.arch }}
          target: google_apis
          avd-name: test
          force-avd-creation: false
          cores: 2
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            adb wait-for-device
            adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done'
            for i in $(seq 1 24); do if adb shell pm path android >/dev/null 2>&1; then echo "flightvis-ci: pm ready"; break; fi; sleep 5; done
            adb shell pm path android
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            flutter test integration_test/ci_functional_suite.dart --dart-define-from-file=tool/ci_functional_defines.json -d emulator-5554 --timeout 8m --no-uninstall --reporter expanded

      - name: Cleanup emulator and mock API
        if: always()
        run: |
          if [ -f mock_server.pid ]; then kill "$(cat mock_server.pid)" 2>/dev/null || true; fi
          adb -s emulator-5554 emu kill 2>/dev/null || adb emu kill 2>/dev/null || true
          pkill -f mock_flight_vis_server.dart 2>/dev/null || true
          pkill -f qemu-system 2>/dev/null || true

  emulator-screenshots:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, android-emulator]
    permissions:
      contents: read
    timeout-minutes: 40
    continue-on-error: true
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve emulator CPU arch
        id: emu_arch
        run: |
          ARCH="${{ vars.EMULATOR_ARCH }}"
          if [ -z "$ARCH" ]; then ARCH=x86_64; fi
          case "$ARCH" in
            x86_64|arm64-v8a) ;;
            *) echo "::error::EMULATOR_ARCH must be x86_64 or arm64-v8a (got $ARCH)"; exit 1 ;;
          esac
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "flightvis-ci: EMULATOR_ARCH=$ARCH"

      - name: flutter pub get
        run: flutter pub get

      - name: Start mock flight_vis API
        run: |
          dart run tool/mock_flight_vis_server.dart &
          echo $! > mock_server.pid
          for i in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:18080/api/devices/anonymous \
              -H 'Content-Type: application/json' \
              -d '{"name":"CI"}'; then
              echo "mock API ready"
              exit 0
            fi
            sleep 2
          done
          echo "mock API failed to start"
          exit 1

      - name: Verify mock API on host
        run: curl -sf http://127.0.0.1:18080/api/ci-health

      - name: Prebuild debug APK (screenshots)
        run: flutter build apk --debug --dart-define-from-file=tool/ci_screenshot_defines.json

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: ${{ steps.emu_arch.outputs.arch }}
          target: google_apis
          avd-name: test
          force-avd-creation: false
          cores: 2
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            adb wait-for-device
            adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done'
            for i in $(seq 1 24); do if adb shell pm path android >/dev/null 2>&1; then echo "flightvis-ci: pm ready"; break; fi; sleep 5; done
            adb shell pm path android
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            flutter test integration_test/screenshot_flow_test.dart --dart-define-from-file=tool/ci_screenshot_defines.json -d emulator-5554 --timeout 8m --no-uninstall --reporter expanded
            mkdir -p docs/emulator-screenshots
            adb pull /sdcard/Download/flightvis-emulator/. docs/emulator-screenshots/ || true
            ls -la docs/emulator-screenshots || true

      - name: Cleanup emulator and mock API
        if: always()
        run: |
          if [ -f mock_server.pid ]; then kill "$(cat mock_server.pid)" 2>/dev/null || true; fi
          adb -s emulator-5554 emu kill 2>/dev/null || adb emu kill 2>/dev/null || true
          pkill -f mock_flight_vis_server.dart 2>/dev/null || true
          pkill -f qemu-system 2>/dev/null || true

      - name: Upload emulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: flight-vis-emulator-screenshots-${{ github.sha }}
          path: docs/emulator-screenshots/
          if-no-files-found: warn