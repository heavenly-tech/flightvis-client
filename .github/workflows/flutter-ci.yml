name: flight_vis CI

concurrency:
  group: flight_vis-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLIGHTVIS_NDK_VERSION: '28.2.13676358'

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Android NDK and Gradle cache
        uses: ./.github/actions/setup-android-ndk
        with:
          ndk-version: ${{ env.FLIGHTVIS_NDK_VERSION }}

      - name: Determine signing policy
        id: signing_policy
        run: |
          require=false
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ] || echo "${{ github.ref }}" | grep -q '^refs/tags/v'; then
              require=true
            fi
          fi
          echo "require_release_keystore=$require" >> "$GITHUB_OUTPUT"

      - name: flutter pub get
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter pub get; then
              exit 0
            fi
            echo "flutter pub get failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Verify ARB key parity
        run: dart run tool/verify_arb_keys.dart

      - name: Check hardcoded UI strings
        run: dart run tool/check_hardcoded_ui_strings.dart

      - name: Check Spanish copy (no voseo)
        run: dart run tool/check_spanish_voseo.dart

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Validate release signing secrets
        if: steps.signing_policy.outputs.require_release_keystore == 'true'
        env:
          FLIGHTVIS_KEYSTORE_BASE64: ${{ secrets.FLIGHTVIS_KEYSTORE_BASE64 }}
          FLIGHTVIS_KEYSTORE_PASSWORD: ${{ secrets.FLIGHTVIS_KEYSTORE_PASSWORD }}
          FLIGHTVIS_KEY_ALIAS: ${{ secrets.FLIGHTVIS_KEY_ALIAS }}
          FLIGHTVIS_KEY_PASSWORD: ${{ secrets.FLIGHTVIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in FLIGHTVIS_KEYSTORE_BASE64 FLIGHTVIS_KEYSTORE_PASSWORD FLIGHTVIS_KEY_ALIAS FLIGHTVIS_KEY_PASSWORD; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::error::Missing GitHub secret $name (required on main and version tags)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Decode release keystore
        id: keystore
        env:
          FLIGHTVIS_KEYSTORE_BASE64: ${{ secrets.FLIGHTVIS_KEYSTORE_BASE64 }}
          FLIGHTVIS_KEYSTORE_PASSWORD: ${{ secrets.FLIGHTVIS_KEYSTORE_PASSWORD }}
          FLIGHTVIS_KEY_ALIAS: ${{ secrets.FLIGHTVIS_KEY_ALIAS }}
          FLIGHTVIS_KEY_PASSWORD: ${{ secrets.FLIGHTVIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$FLIGHTVIS_KEYSTORE_BASE64" ]; then
            echo "$FLIGHTVIS_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storePassword=$FLIGHTVIS_KEYSTORE_PASSWORD
          keyPassword=$FLIGHTVIS_KEY_PASSWORD
          keyAlias=$FLIGHTVIS_KEY_ALIAS
          storeFile=release.keystore
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.signing_policy.outputs.require_release_keystore }}" = "true" ]; then
              echo "::error::Release keystore decode failed on protected ref"
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Android debug keystore (PR debug-signed APK)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FLIGHTVIS_BASE_URL=https://flight.heavenly.cl

      - name: Package metadata
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "$SHA" > build/app-release.apk.sha256
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=${VERSION%%+*}
          VERSION_CODE=${VERSION##*+}
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            RELEASE_SIGNED=true
          else
            RELEASE_SIGNED=false
          fi
          cat > build/app-release.json <<EOF
          {"version":"$VERSION_NAME","versionCode":$VERSION_CODE,"sha256":"$SHA","commit":"${{ github.sha }}","releaseSigned":$RELEASE_SIGNED}
          EOF

      - name: Extract APK signing certificate SHA-256
        id: cert
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -path '*/apksigner' -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          set +e
          "$APKSIGNER" verify --print-certs "$APK" > build/app-release.cert-sha256.txt 2>&1
          VERIFY_EXIT=$?
          set -e
          OUT="$(cat build/app-release.cert-sha256.txt)"
          if ! echo "$OUT" | grep -qi 'SHA-256 digest:'; then
            echo "::error::apksigner did not print a SHA-256 digest (exit $VERIFY_EXIT)"
            cat build/app-release.cert-sha256.txt
            exit 1
          fi
          if [ "$VERIFY_EXIT" -ne 0 ]; then
            echo "apksigner verify exited $VERIFY_EXIT (continuing — certs present for release pin)"
          fi
          DIGEST="$(echo "$OUT" | grep -i 'certificate SHA-256 digest:' | head -1 | sed -E 's/.*SHA-256 digest:[[:space:]]*//')"
          DIGEST="${DIGEST//$'\r'/}"
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not parse certificate SHA-256 digest from apksigner output"
            head -40 build/app-release.cert-sha256.txt >&2
            exit 1
          fi
          FINGERPRINT="$(DIGEST="$DIGEST" python3 -c "import os,sys;h=os.environ['DIGEST'].replace(':','').strip().upper();(len(h)!=64 or any(c not in '0123456789ABCDEF' for c in h)) and sys.exit(1);print(':'.join(h[i:i+2] for i in range(0,len(h),2)))")"
          echo "$FINGERPRINT" > build/app-release.cert-sha256
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Assert release certificate matches App Links pin
        if: steps.keystore.outputs.signed == 'true'
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          ANDROID_CERT_SHA256_SECRET: ${{ secrets.ANDROID_CERT_SHA256 }}
          ACTUAL_FINGERPRINT: ${{ steps.cert.outputs.fingerprint }}
        run: |
          set -euo pipefail
          EXPECTED="${ANDROID_CERT_SHA256:-}"
          if [ -z "$EXPECTED" ]; then
            EXPECTED="${ANDROID_CERT_SHA256_SECRET:-}"
          fi
          if [ -z "$EXPECTED" ]; then
            echo "::error::Release-signed build requires vars.ANDROID_CERT_SHA256 or secrets.ANDROID_CERT_SHA256"
            exit 1
          fi
          normalize() {
            DIGEST="$1" python3 -c "import os;h=os.environ['DIGEST'].replace(':','').strip().upper();print(':'.join(h[i:i+2] for i in range(0,len(h),2)))"
          }
          EXPECTED_N="$(normalize "$EXPECTED")"
          ACTUAL_N="$(normalize "$ACTUAL_FINGERPRINT")"
          if [ "$EXPECTED_N" != "$ACTUAL_N" ]; then
            echo "::error::APK cert SHA-256 mismatch (expected App Links pin)"
            echo "Expected: $EXPECTED_N"
            echo "Actual:   $ACTUAL_N"
            exit 1
          fi
          echo "Release certificate matches expected App Links SHA-256"

      - name: Verify release artifact bundle
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -f build/app-release.apk.sha256
          test -f build/app-release.json
          test -s build/app-release.cert-sha256
          echo "release bundle OK"

      - name: Job summary
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            echo "### APK signed with release keystore" >> "$GITHUB_STEP_SUMMARY"
            echo "Signing cert SHA-256: \`${{ steps.cert.outputs.fingerprint }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK debug-signed (PR only — not for App Links / publish)" >> "$GITHUB_STEP_SUMMARY"
            echo "Signing cert SHA-256: \`${{ steps.cert.outputs.fingerprint }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Artifacts: app-release.apk, app-release.apk.sha256, app-release.json, app-release.cert-sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Golden UI screenshots (widget tests)
        run: flutter test test/golden_screenshots_test.dart

      - name: Guard artifacts exclude keystores
        run: |
          set -euo pipefail
          fail=0
          for target in \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app-release.apk.sha256 \
            build/app-release.json \
            build/app-release.cert-sha256 \
            docs/screenshots; do
            if [ ! -e "$target" ]; then
              continue
            fi
            case "$target" in
              *.keystore|*.jks)
                echo "::error::Refusing to upload keystore material: $target"
                fail=1
                ;;
            esac
            if [ -d "$target" ]; then
              if find "$target" -type f \( -name '*.keystore' -o -name '*.jks' \) | grep -q .; then
                echo "::error::Keystore material under upload path: $target"
                fail=1
              fi
            fi
          done
          [ "$fail" -eq 0 ]

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.keystore.outputs.signed == 'true' && format('flight-vis-android-{0}', github.sha) || format('flight-vis-android-debugsigned-{0}', github.sha) }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.apk.sha256
            build/app-release.json
            build/app-release.cert-sha256
            docs/screenshots/

      - name: Attach to GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.apk.sha256
            build/app-release.json
            build/app-release.cert-sha256

      - name: Remove CI signing material
        if: always()
        run: |
          rm -f android/app/release.keystore android/key.properties

  emulator-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, android-emulator, linux, x64, kvm]
    concurrency:
      group: flightvis-selfhosted-emu-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    timeout-minutes: 32
    needs: build
    env:
      ANDROID_SDK_ROOT: /home/ghrunner/android-sdk
      ANDROID_HOME: /home/ghrunner/android-sdk
      FLIGHTVIS_EMULATOR_API: '30'
      FLIGHTVIS_EMULATOR_ARCH: x86_64
      FLIGHTVIS_EMULATOR_TARGET: google_apis
    steps:
      - uses: actions/checkout@v4

      - name: Self-hosted host disk cleanup
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_host_disk_cleanup
          exit 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Android NDK and Gradle cache
        uses: ./.github/actions/setup-android-ndk
        with:
          ndk-version: ${{ env.FLIGHTVIS_NDK_VERSION }}

      - name: Resolve emulator CPU arch
        id: emu_arch
        run: |
          ARCH="${{ vars.EMULATOR_ARCH }}"
          if [ -z "$ARCH" ]; then ARCH=x86_64; fi
          case "$ARCH" in
            x86_64) ;;
            *) echo "::error::EMULATOR_ARCH must be x86_64 on the linux/kvm runner (got $ARCH)"; exit 1 ;;
          esac
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "flightvis-ci: EMULATOR_ARCH=$ARCH"

      - name: flutter pub get
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter pub get; then
              exit 0
            fi
            echo "flutter pub get failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Start mock flight_vis API
        run: |
          dart run tool/mock_flight_vis_server.dart &
          echo $! > mock_server.pid
          for i in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:18080/api/devices/anonymous \
              -H 'Content-Type: application/json' \
              -d '{"name":"CI"}'; then
              echo "mock API ready"
              exit 0
            fi
            sleep 2
          done
          echo "mock API failed to start"
          exit 1

      - name: Verify mock API on host
        run: curl -sf http://127.0.0.1:18080/api/ci-health

      - name: Prebuild debug APK (functional)
        run: flutter build apk --debug --dart-define-from-file=tool/ci_functional_defines.json

      - name: Emulator host preflight
        timeout-minutes: 6
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_ensure_host_sdk_for_runner
          emulator_host_preflight_checks
          emulator_host_stale_cleanup

      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 28
        with:
          api-level: 30
          arch: ${{ steps.emu_arch.outputs.arch }}
          target: google_apis
          avd-name: test
          force-avd-creation: true
          cores: 1
          ram-size: 3072M
          emulator-boot-timeout: 600
          pre-emulator-launch-script: .github/scripts/emulator_pre_launch.sh
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: false
          script: bash .github/scripts/emulator_run_functional.sh

      - name: Collect emulator diagnostics (host fallback)
        if: always()
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          collect_host_diagnostics
          exit 0

      - name: Cleanup emulator and mock API
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_job_cleanup
          exit 0

      - name: Report emulator diagnostics size
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-emulator-diagnostics
          du -sh ci-emulator-diagnostics 2>/dev/null || true
          ls -la ci-emulator-diagnostics/ 2>/dev/null || true

      - name: Upload emulator CI logs
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flight-vis-emulator-tests-logs-${{ github.sha }}
          path: ci-emulator-diagnostics/
          if-no-files-found: warn

  emulator-screenshots:
    if: |
      always()
      && needs.build.result == 'success'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, android-emulator, linux, x64, kvm]
    concurrency:
      group: flightvis-selfhosted-emu-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    timeout-minutes: 38
    continue-on-error: true
    needs: [build, emulator-tests]
    env:
      ANDROID_SDK_ROOT: /home/ghrunner/android-sdk
      ANDROID_HOME: /home/ghrunner/android-sdk
      FLIGHTVIS_EMULATOR_API: '30'
      FLIGHTVIS_EMULATOR_ARCH: x86_64
      FLIGHTVIS_EMULATOR_TARGET: google_apis
    steps:
      - uses: actions/checkout@v4

      - name: Self-hosted host disk cleanup
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_host_disk_cleanup
          exit 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Android NDK and Gradle cache
        uses: ./.github/actions/setup-android-ndk
        with:
          ndk-version: ${{ env.FLIGHTVIS_NDK_VERSION }}

      - name: Resolve emulator CPU arch
        id: emu_arch
        run: |
          ARCH="${{ vars.EMULATOR_ARCH }}"
          if [ -z "$ARCH" ]; then ARCH=x86_64; fi
          case "$ARCH" in
            x86_64) ;;
            *) echo "::error::EMULATOR_ARCH must be x86_64 on the linux/kvm runner (got $ARCH)"; exit 1 ;;
          esac
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "flightvis-ci: EMULATOR_ARCH=$ARCH"

      - name: flutter pub get
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter pub get; then
              exit 0
            fi
            echo "flutter pub get failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Start mock flight_vis API
        run: |
          dart run tool/mock_flight_vis_server.dart &
          echo $! > mock_server.pid
          for i in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:18080/api/devices/anonymous \
              -H 'Content-Type: application/json' \
              -d '{"name":"CI"}'; then
              echo "mock API ready"
              exit 0
            fi
            sleep 2
          done
          echo "mock API failed to start"
          exit 1

      - name: Verify mock API on host
        run: curl -sf http://127.0.0.1:18080/api/ci-health

      - name: Prebuild debug APK (screenshots)
        run: flutter build apk --debug --dart-define-from-file=tool/ci_screenshot_defines.json

      - name: Emulator host preflight
        timeout-minutes: 6
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_ensure_host_sdk_for_runner
          emulator_host_preflight_checks
          emulator_host_stale_cleanup

      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        with:
          api-level: 30
          arch: ${{ steps.emu_arch.outputs.arch }}
          target: google_apis
          avd-name: test
          force-avd-creation: true
          cores: 1
          ram-size: 3072M
          emulator-boot-timeout: 600
          pre-emulator-launch-script: .github/scripts/emulator_pre_launch.sh
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: false
          script: bash .github/scripts/emulator_run_screenshots.sh

      - name: Collect emulator diagnostics (host fallback)
        if: always()
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          collect_host_diagnostics
          exit 0

      - name: Cleanup emulator and mock API
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_job_cleanup
          exit 0

      - name: Report emulator diagnostics size
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-emulator-diagnostics
          du -sh ci-emulator-diagnostics 2>/dev/null || true
          ls -la ci-emulator-diagnostics/ 2>/dev/null || true

      - name: Upload emulator CI logs
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flight-vis-emulator-screenshots-logs-${{ github.sha }}
          path: ci-emulator-diagnostics/
          if-no-files-found: warn

      - name: Upload emulator screenshots
        timeout-minutes: 4
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flight-vis-emulator-screenshots-${{ github.sha }}
          path: docs/emulator-screenshots/
          if-no-files-found: warn