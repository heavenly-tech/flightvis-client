name: flight_vis CI

concurrency:
  group: flight_vis-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLIGHTVIS_NDK_VERSION: '28.2.13676358'

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Setup Android NDK and Gradle cache
        uses: ./.github/actions/setup-android-ndk
        with:
          ndk-version: ${{ env.FLIGHTVIS_NDK_VERSION }}

      - name: flutter pub get
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter pub get; then
              exit 0
            fi
            echo "flutter pub get failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Verify ARB key parity
        run: dart run tool/verify_arb_keys.dart

      - name: Check hardcoded UI strings
        run: dart run tool/check_hardcoded_ui_strings.dart

      - name: Check Spanish copy (no voseo)
        run: dart run tool/check_spanish_voseo.dart

      - name: flutter analyze
        run: flutter analyze

      - name: Ensure Android debug keystore (manifest merge / PR APK)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Merge debug Android manifest (C-3 unit test)
        run: |
          set -euo pipefail
          flutter build apk --debug --dart-define=FLIGHTVIS_BASE_URL=https://flight.heavenly.cl
          MANIFEST="$(find android/app/build -type f -name AndroidManifest.xml | grep -E 'merged_manifest|packaged_manifests' | head -1)"
          test -n "$MANIFEST"
          mkdir -p tool
          printf '%s\n' "$MANIFEST" > tool/ci_merged_manifest_path.txt

      - name: flutter test
        run: flutter test

      - name: Golden UI screenshots (widget tests)
        run: flutter test test/golden_screenshots_test.dart

      - name: Upload debug APK and goldens (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flight-vis-android-debugsigned-${{ github.sha }}
          retention-days: 7
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            docs/screenshots/

  release-android:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Setup Android NDK and Gradle cache
        uses: ./.github/actions/setup-android-ndk
        with:
          ndk-version: ${{ env.FLIGHTVIS_NDK_VERSION }}

      - name: flutter pub get
        run: flutter pub get

      - name: Validate release signing secrets
        env:
          FLIGHTVIS_KEYSTORE_BASE64: ${{ secrets.FLIGHTVIS_KEYSTORE_BASE64 }}
          FLIGHTVIS_KEYSTORE_PASSWORD: ${{ secrets.FLIGHTVIS_KEYSTORE_PASSWORD }}
          FLIGHTVIS_KEY_ALIAS: ${{ secrets.FLIGHTVIS_KEY_ALIAS }}
          FLIGHTVIS_KEY_PASSWORD: ${{ secrets.FLIGHTVIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in FLIGHTVIS_KEYSTORE_BASE64 FLIGHTVIS_KEYSTORE_PASSWORD FLIGHTVIS_KEY_ALIAS FLIGHTVIS_KEY_PASSWORD; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::error::Missing secret $name in the release environment"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Decode release keystore
        id: keystore
        env:
          FLIGHTVIS_KEYSTORE_BASE64: ${{ secrets.FLIGHTVIS_KEYSTORE_BASE64 }}
          FLIGHTVIS_KEYSTORE_PASSWORD: ${{ secrets.FLIGHTVIS_KEYSTORE_PASSWORD }}
          FLIGHTVIS_KEY_ALIAS: ${{ secrets.FLIGHTVIS_KEY_ALIAS }}
          FLIGHTVIS_KEY_PASSWORD: ${{ secrets.FLIGHTVIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$FLIGHTVIS_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$FLIGHTVIS_KEYSTORE_PASSWORD
          keyPassword=$FLIGHTVIS_KEY_PASSWORD
          keyAlias=$FLIGHTVIS_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build release APK
        run: flutter build apk --release --dart-define=FLIGHTVIS_BASE_URL=https://flight.heavenly.cl

      - name: Package metadata
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "$SHA" > build/app-release.apk.sha256
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=${VERSION%%+*}
          VERSION_CODE=${VERSION##*+}
          cat > build/app-release.json <<EOF
          {"version":"$VERSION_NAME","versionCode":$VERSION_CODE,"sha256":"$SHA","commit":"${{ github.sha }}","releaseSigned":true}
          EOF

      - name: Extract APK signing certificate SHA-256
        id: cert
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -path '*/apksigner' -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          set +e
          "$APKSIGNER" verify --print-certs "$APK" > build/app-release.cert-sha256.txt 2>&1
          VERIFY_EXIT=$?
          set -e
          OUT="$(cat build/app-release.cert-sha256.txt)"
          if ! echo "$OUT" | grep -qi 'SHA-256 digest:'; then
            echo "::error::apksigner did not print a SHA-256 digest (exit $VERIFY_EXIT)"
            cat build/app-release.cert-sha256.txt
            exit 1
          fi
          DIGEST="$(echo "$OUT" | grep -i 'certificate SHA-256 digest:' | head -1 | sed -E 's/.*SHA-256 digest:[[:space:]]*//')"
          DIGEST="${DIGEST//$'\r'/}"
          FINGERPRINT="$(DIGEST="$DIGEST" python3 -c "import os,sys;h=os.environ['DIGEST'].replace(':','').strip().upper();(len(h)!=64 or any(c not in '0123456789ABCDEF' for c in h)) and sys.exit(1);print(':'.join(h[i:i+2] for i in range(0,len(h),2)))")"
          echo "$FINGERPRINT" > build/app-release.cert-sha256
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Assert release certificate matches App Links pin
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          ANDROID_CERT_SHA256_SECRET: ${{ secrets.ANDROID_CERT_SHA256 }}
          ACTUAL_FINGERPRINT: ${{ steps.cert.outputs.fingerprint }}
        run: |
          set -euo pipefail
          EXPECTED="${ANDROID_CERT_SHA256:-}"
          if [ -z "$EXPECTED" ]; then
            EXPECTED="${ANDROID_CERT_SHA256_SECRET:-}"
          fi
          if [ -z "$EXPECTED" ]; then
            echo "::error::Release build requires vars.ANDROID_CERT_SHA256 or secrets.ANDROID_CERT_SHA256"
            exit 1
          fi
          normalize() {
            DIGEST="$1" python3 -c "import os;h=os.environ['DIGEST'].replace(':','').strip().upper();print(':'.join(h[i:i+2] for i in range(0,len(h),2)))"
          }
          EXPECTED_N="$(normalize "$EXPECTED")"
          ACTUAL_N="$(normalize "$ACTUAL_FINGERPRINT")"
          if [ "$EXPECTED_N" != "$ACTUAL_N" ]; then
            echo "::error::APK cert SHA-256 mismatch"
            exit 1
          fi

      - name: Guard artifacts exclude keystores
        run: |
          set -euo pipefail
          if find build -type f \( -name '*.keystore' -o -name '*.jks' \) | grep -q .; then
            echo "::error::Keystore material under build/"
            exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flight-vis-android-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.apk.sha256
            build/app-release.json
            build/app-release.cert-sha256

      - name: Attach to GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.apk.sha256
            build/app-release.json
            build/app-release.cert-sha256

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.keystore android/key.properties

  emulator-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, android-emulator, linux, x64, kvm]
    concurrency:
      group: flightvis-selfhosted-emu-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    timeout-minutes: 32
    needs: build
    env:
      ANDROID_SDK_ROOT: /home/ghrunner/android-sdk
      ANDROID_HOME: /home/ghrunner/android-sdk
      FLIGHTVIS_EMULATOR_API: '30'
      FLIGHTVIS_EMULATOR_ARCH: x86_64
      FLIGHTVIS_EMULATOR_TARGET: google_apis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Self-hosted host disk cleanup
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_host_disk_cleanup
          exit 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Setup Android NDK and Gradle cache
        uses: ./.github/actions/setup-android-ndk
        with:
          ndk-version: ${{ env.FLIGHTVIS_NDK_VERSION }}

      - name: Resolve emulator CPU arch
        id: emu_arch
        run: |
          ARCH="${{ vars.EMULATOR_ARCH }}"
          if [ -z "$ARCH" ]; then ARCH=x86_64; fi
          case "$ARCH" in
            x86_64) ;;
            *) echo "::error::EMULATOR_ARCH must be x86_64 on the linux/kvm runner (got $ARCH)"; exit 1 ;;
          esac
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "flightvis-ci: EMULATOR_ARCH=$ARCH"

      - name: flutter pub get
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter pub get; then
              exit 0
            fi
            echo "flutter pub get failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Start mock flight_vis API
        run: |
          dart run tool/mock_flight_vis_server.dart &
          echo $! > mock_server.pid
          for i in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:18080/api/devices/anonymous \
              -H 'Content-Type: application/json' \
              -d '{"name":"CI"}'; then
              echo "mock API ready"
              exit 0
            fi
            sleep 2
          done
          echo "mock API failed to start"
          exit 1

      - name: Verify mock API on host
        run: curl -sf http://127.0.0.1:18080/api/ci-health

      - name: Prebuild debug APK (functional)
        run: flutter build apk --debug --dart-define-from-file=tool/ci_functional_defines.json

      - name: Emulator host preflight
        timeout-minutes: 6
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_ensure_host_sdk_for_runner
          emulator_host_preflight_checks
          emulator_host_stale_cleanup

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        timeout-minutes: 28
        with:
          api-level: 30
          arch: ${{ steps.emu_arch.outputs.arch }}
          target: google_apis
          avd-name: test
          force-avd-creation: true
          cores: 1
          ram-size: 3072M
          emulator-boot-timeout: 600
          pre-emulator-launch-script: .github/scripts/emulator_pre_launch.sh
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: false
          script: bash .github/scripts/emulator_run_functional.sh

      - name: Collect emulator diagnostics (host fallback)
        if: always()
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          collect_host_diagnostics
          exit 0

      - name: Cleanup emulator and mock API
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_job_cleanup
          exit 0

      - name: Report emulator diagnostics size
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-emulator-diagnostics
          du -sh ci-emulator-diagnostics 2>/dev/null || true
          ls -la ci-emulator-diagnostics/ 2>/dev/null || true

      - name: Upload emulator CI logs
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flight-vis-emulator-tests-logs-${{ github.sha }}
          path: ci-emulator-diagnostics/
          if-no-files-found: warn

  emulator-screenshots:
    if: |
      always()
      && needs.build.result == 'success'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, android-emulator, linux, x64, kvm]
    concurrency:
      group: flightvis-selfhosted-emu-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    timeout-minutes: 38
    continue-on-error: true
    needs: [build, emulator-tests]
    env:
      ANDROID_SDK_ROOT: /home/ghrunner/android-sdk
      ANDROID_HOME: /home/ghrunner/android-sdk
      FLIGHTVIS_EMULATOR_API: '30'
      FLIGHTVIS_EMULATOR_ARCH: x86_64
      FLIGHTVIS_EMULATOR_TARGET: google_apis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Self-hosted host disk cleanup
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_host_disk_cleanup
          exit 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Setup Android NDK and Gradle cache
        uses: ./.github/actions/setup-android-ndk
        with:
          ndk-version: ${{ env.FLIGHTVIS_NDK_VERSION }}

      - name: Resolve emulator CPU arch
        id: emu_arch
        run: |
          ARCH="${{ vars.EMULATOR_ARCH }}"
          if [ -z "$ARCH" ]; then ARCH=x86_64; fi
          case "$ARCH" in
            x86_64) ;;
            *) echo "::error::EMULATOR_ARCH must be x86_64 on the linux/kvm runner (got $ARCH)"; exit 1 ;;
          esac
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "flightvis-ci: EMULATOR_ARCH=$ARCH"

      - name: flutter pub get
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter pub get; then
              exit 0
            fi
            echo "flutter pub get failed (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Start mock flight_vis API
        run: |
          dart run tool/mock_flight_vis_server.dart &
          echo $! > mock_server.pid
          for i in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:18080/api/devices/anonymous \
              -H 'Content-Type: application/json' \
              -d '{"name":"CI"}'; then
              echo "mock API ready"
              exit 0
            fi
            sleep 2
          done
          echo "mock API failed to start"
          exit 1

      - name: Verify mock API on host
        run: curl -sf http://127.0.0.1:18080/api/ci-health

      - name: Prebuild debug APK (screenshots)
        run: flutter build apk --debug --dart-define-from-file=tool/ci_screenshot_defines.json

      - name: Emulator host preflight
        timeout-minutes: 6
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_ensure_host_sdk_for_runner
          emulator_host_preflight_checks
          emulator_host_stale_cleanup

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        timeout-minutes: 30
        with:
          api-level: 30
          arch: ${{ steps.emu_arch.outputs.arch }}
          target: google_apis
          avd-name: test
          force-avd-creation: true
          cores: 1
          ram-size: 3072M
          emulator-boot-timeout: 600
          pre-emulator-launch-script: .github/scripts/emulator_pre_launch.sh
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: false
          script: bash .github/scripts/emulator_run_screenshots.sh

      - name: Collect emulator diagnostics (host fallback)
        if: always()
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          collect_host_diagnostics
          exit 0

      - name: Cleanup emulator and mock API
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set +e
          # shellcheck disable=SC1091
          source .github/scripts/emulator_ci_host.sh
          emulator_job_cleanup
          exit 0

      - name: Report emulator diagnostics size
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-emulator-diagnostics
          du -sh ci-emulator-diagnostics 2>/dev/null || true
          ls -la ci-emulator-diagnostics/ 2>/dev/null || true

      - name: Upload emulator CI logs
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flight-vis-emulator-screenshots-logs-${{ github.sha }}
          path: ci-emulator-diagnostics/
          if-no-files-found: warn

      - name: Upload emulator screenshots
        timeout-minutes: 4
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flight-vis-emulator-screenshots-${{ github.sha }}
          path: docs/emulator-screenshots/
          if-no-files-found: warn