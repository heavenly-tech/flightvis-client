name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to publish
        type: choice
        options: [both, android, ios]
        default: both

env:
  ANDROID_APPLICATION_ID: cl.heavenly.flightvis
  IOS_BUNDLE_ID: cl.heavenly.flightvis

jobs:
  build-android:
    if: ${{ github.event_name == 'push' || inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare keystore + key.properties
        env:
          FLIGHTVIS_KEYSTORE_BASE64: ${{ secrets.FLIGHTVIS_KEYSTORE_BASE64 }}
          FLIGHTVIS_KEYSTORE_PASSWORD: ${{ secrets.FLIGHTVIS_KEYSTORE_PASSWORD }}
          FLIGHTVIS_KEY_ALIAS: ${{ secrets.FLIGHTVIS_KEY_ALIAS }}
          FLIGHTVIS_KEY_PASSWORD: ${{ secrets.FLIGHTVIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$FLIGHTVIS_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$FLIGHTVIS_KEYSTORE_PASSWORD
          keyPassword=$FLIGHTVIS_KEY_PASSWORD
          keyAlias=$FLIGHTVIS_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=FLIGHTVIS_BASE_URL=https://flight.heavenly.cl

      - uses: actions/upload-artifact@v4
        with:
          name: flight-vis-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  smoke-test-android:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: flight-vis-android-release
          path: .

      - name: Launch emulator and verify app starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r app-release.apk
            adb shell am start -W -n cl.heavenly.flightvis/cl.heavenly.flightvis.MainActivity
            sleep 10
            adb shell screencap -p /sdcard/launch.png
            adb pull /sdcard/launch.png launch.png
            adb shell pidof cl.heavenly.flightvis > /dev/null || { echo "App process not running after launch — crashed."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: flight-vis-android-launch-screenshot
          path: launch.png
          if-no-files-found: error

  release-github:
    needs: [build-android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flight-vis-android-release
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk

      - name: Remove CI signing material
        if: always()
        run: rm -f android/app/release.keystore android/key.properties