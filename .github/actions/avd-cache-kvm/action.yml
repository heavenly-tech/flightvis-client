name: AVD cache and KVM
description: Enable KVM on Linux and cache AVD plus system images for API 30 x86_64.
inputs:
  api-level:
    description: Android API level
    required: false
    default: '30'
outputs:
  cache-hit:
    description: Whether the AVD cache was restored
    value: ${{ steps.avd-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Enable KVM group perms
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: AVD cache
      id: avd-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
          ~/.android/sdk/system-images/*
        key: avd-${{ runner.os }}-${{ inputs.api-level }}-google_apis-x86_64-v2
        restore-keys: |
          avd-${{ runner.os }}-${{ inputs.api-level }}-google_apis-x86_64-
          avd-${{ runner.os }}-${{ inputs.api-level }}-