name: flight_vis
description: "flight_vis pilot tracker for flying clubs"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  traccar_client_sdk: ^1.1.3
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  flutter_secure_storage: ^11.2.0
  app_settings: ^9.0.0
  shared_preferences: ^2.5.5
  permission_handler: ^11.4.0
  device_info_plus: ^13.3.0
  timezone: ^0.10.0
  intl: any
  app_links: ^7.2.2
  passkeys: ^2.24.2
  url_launcher: ^6.3.1
  flutter_map: 8.3.2
  latlong2: 0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true